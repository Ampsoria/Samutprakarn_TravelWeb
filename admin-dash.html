<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Samut Prakan Travel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stat-card {
            background: white;
            padding: var(--spacing-3);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <div class="admin-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="#" class="nav-logo" style="justify-content:center;">
                    <span style="color:var(--primary-orange);">Admin</span>Panel
                </a>
            </div>
            <nav class="sidebar-menu">
                <a href="admin-dash.html" class="sidebar-link active">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                    </svg>
                    <span data-i18n="admin_nav_dash">ภาพรวม (Dashboard)</span>
                </a>
                <a href="admin-users.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <span data-i18n="admin_nav_users">จัดการผู้ใช้งาน</span>
                </a>
                <a href="admin-places.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span data-i18n="admin_nav_places">จัดการสถานที่</span>
                </a>
                <a href="admin-reviews.html" class="sidebar-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
                        </path>
                    </svg>
                    <span data-i18n="admin_nav_reviews">ตรวจสอบรีวิว</span>
                </a>
            </nav>
            <div style="padding:var(--spacing-3);">
                <div class="lang-switch mb-3" style="justify-content:center;">
                    <button class="lang-btn active" data-lang="th">TH</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
        <a href="login.html" class="btn btn-outline btn-full text-small" data-i18n="admin_logout">ออกจากระบบ</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="flex justify-between items-center mb-4">
                <h1 class="h2" data-i18n="admin_dash_title">ภาพรวม (Dashboard)</h1>
            </div>

            <!-- Summary Cards -->
            <div class="grid-cols-3 mb-4" style="grid-template-columns: repeat(4, 1fr);">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#E0F2FE; color:#0284C7;">👥</div>
                    <div>
                        <div class="text-small text-muted" data-i18n="admin_dash_stat_users">ผู้ใช้งานทั้งหมด</div>
                        <div class="h3" id="statUsers" style="font-family: var(--font-heading);">...</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:#FEF3C7; color:#D97706;">📍</div>
                    <div>
                        <div class="text-small text-muted" data-i18n="admin_dash_stat_places">สถานที่ในระบบ</div>
                        <div class="h3" id="statPlaces" style="font-family: var(--font-heading);">...</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:#FEF9C3; color:#CA8A04;">⏳</div>
                    <div>
                        <div class="text-small text-muted" data-i18n="admin_dash_stat_reviews">รีวิวที่รออนุมัติ</div>
                        <div class="h3" id="statPending" style="font-family: var(--font-heading);">...</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:#DCFCE7; color:#16A34A;">⭐</div>
                    <div>
                        <div class="text-small text-muted">รีวิวทั้งหมด</div>
                        <div class="h3" id="statReviews" style="font-family: var(--font-heading);">...</div>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="card" style="height: 400px;">
                <h3 class="h3 mb-2" data-i18n="admin_dash_chart_title">ความนิยมแบ่งตามหมวดหมู่</h3>
                <div style="height: 300px;">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Chart Config + Dynamic Stats -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // --- Load real stats from API ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const stats = await StatsAPI.getOverview();
                document.getElementById('statUsers').textContent = (stats.totalUsers || 0).toLocaleString();
                document.getElementById('statPlaces').textContent = (stats.totalPlaces || 0).toLocaleString();
                document.getElementById('statPending').textContent = (stats.pendingReviews || 0).toLocaleString();
                document.getElementById('statReviews').textContent = (stats.totalReviews || 0).toLocaleString();
            } catch (err) {
                console.warn('Could not load admin stats:', err);
            }

            // --- Load real category data for chart ---
            let chartLabels = ['ธรรมชาติ', 'คาเฟ่', 'วัด', 'พิพิธภัณฑ์', 'ช้อปปิ้ง'];
            let chartData = [0, 0, 0, 0, 0];
            try {
                const catStats = await StatsAPI.getCategories();
                if (catStats.categories && catStats.categories.length > 0) {
                    const catNameMap = {
                        nature: 'ธรรมชาติ', temple: 'วัด', history: 'ประวัติศาสตร์',
                        art: 'ศิลปวัฒนธรรม', food: 'อาหาร', cafe: 'คาเฟ่', shopping: 'ช้อปปิ้ง'
                    };
                    chartLabels = catStats.categories.map(c => catNameMap[c.category] || c.category);
                    chartData = catStats.categories.map(c => c.placeCount || 0);
                }
            } catch (err) {
                console.warn('Could not load category stats:', err);
            }

            const ctx = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'จำนวนสถานที่',
                        data: chartData,
                        backgroundColor: '#F97316',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#F3F4F6' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        });
    </script>
</body>

</html>
